# NebulaDay colour scheme for qt5ct / qt6ct, part of cosmic-nebuladay-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> NebulaDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#2b2f35, #f1f3f6, #f1f3f6, #ced1d4, #d8dbdf, #d8dbdf, #2b2f35, #1f2329, #2b2f35, #f1f3f6, #e2e5e9, #d8dbdf, #186a61, #e2e5e9, #186a61, #186a61, #f1f3f6, #e2e5e9, #f1f3f6, #2b2f35, #555f72
disabled_colors=#858ea2, #f1f3f6, #f1f3f6, #ced1d4, #d8dbdf, #d8dbdf, #858ea2, #31469b, #858ea2, #e2e5e9, #e2e5e9, #d8dbdf, #ced1d4, #31469b, #555f72, #555f72, #f1f3f6, #e2e5e9, #f1f3f6, #2b2f35, #ced1d4
inactive_colors=#2b2f35, #f1f3f6, #f1f3f6, #ced1d4, #d8dbdf, #d8dbdf, #2b2f35, #1f2329, #2b2f35, #f1f3f6, #e2e5e9, #d8dbdf, #186a61, #e2e5e9, #186a61, #186a61, #f1f3f6, #e2e5e9, #f1f3f6, #2b2f35, #555f72
