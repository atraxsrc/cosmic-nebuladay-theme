# NebulaDay for lazygit, part of cosmic-nebuladay-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/nebuladay.yml and
# zsh/nebuladay.zsh sets LG_CONFIG_FILE to "config.yml,nebuladay.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/nebuladay.yml"
gui:
  theme:
    activeBorderColor:
      - "#186A61"
      - bold
    inactiveBorderColor:
      - "#CED1D4"
    searchingActiveBorderColor:
      - "#914C27"
      - bold
    optionsTextColor:
      - "#31469B"
    selectedLineBgColor:
      - "#D8DBDF"
    inactiveViewSelectedLineBgColor:
      - "#F1F3F6"
    cherryPickedCommitFgColor:
      - "#E2E5E9"
    cherryPickedCommitBgColor:
      - "#604686"
    markedBaseCommitFgColor:
      - "#E2E5E9"
    markedBaseCommitBgColor:
      - "#1D6778"
    unstagedChangesColor:
      - "#A8243B"
    defaultFgColor:
      - "#2B2F35"
  authorColors:
    "*": "#604686"
